<div class="container">
  <h2>Registrazione</h2>

  <form (ngSubmit)="register()">
    <input
      type="text"
      [(ngModel)]="username"
      name="username"
      placeholder="Username"
      required
    />

    <input
      type="password"
      [(ngModel)]="password"
      name="password"
      placeholder="Password"
      required
      minlength="3"
    />

    <div *ngIf="errorMessage" class="error">
      {{ errorMessage }}
    </div>

    <p class="link-text">
      Se sei già registrato, effettua il
      <a routerLink="/login">Login</a>.
    </p>

    <button type="submit">Registrati</button>
  </form>
</div>
